<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VisioOne Bridge Demo</title>

  <!--
    ══════════════════════════════════════════════════════════════════
    TODO — Remplacez par l'URL CDN réelle de votre SDK VisioOne
    ══════════════════════════════════════════════════════════════════
  -->
  <script src="https://cdn.visioglobe.com/visioone/latest/sdk/visioone.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* Overlay de debug — visible seulement hors WebView RN */
    #debug {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      font: 11px/1.6 monospace;
      padding: 8px 12px;
      max-height: 160px;
      overflow-y: auto;
      z-index: 9999;
      border-top: 1px solid #333;
    }
    #debug.visible { display: block; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="debug"></div>

  <script>
  (function () {
    'use strict';

    // ── Détection du contexte ──────────────────────────────────────────────
    var IS_RN = typeof window.ReactNativeWebView !== 'undefined';

    // Affiche le panel debug hors React Native pour faciliter le développement
    if (!IS_RN) {
      document.getElementById('debug').classList.add('visible');
    }

    function log(msg) {
      var el = document.getElementById('debug');
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toISOString().substr(11, 8) + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log('[VisioOne Bridge]', msg);
    }

    // ── Bridge : VisioOne → React Native ──────────────────────────────────
    //
    // Appelé par ce script pour envoyer un événement vers l'app React Native.
    // En dehors de RN, les messages sont loggés dans le panel debug.
    //
    function sendToRN(type, payload) {
      var data = JSON.stringify({ type: type, payload: payload || {} });
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(data);
      } else {
        log('→ RN : ' + data);
      }
    }

    // Expose sendToRN globalement (utilisé par le BRIDGE_BOOTSTRAP_SCRIPT de RN)
    window.sendToRN = sendToRN;


    // ══════════════════════════════════════════════════════════════════════
    // TODO — Adaptez l'initialisation à l'API réelle de votre SDK VisioOne
    // ══════════════════════════════════════════════════════════════════════

    var hash = new URLSearchParams(window.location.search).get('hash') || '';

    var viewer = new VisioOne({
      container: document.getElementById('map'),
      hash: hash,
    });


    // ── Événements VisioOne → React Native ────────────────────────────────

    // Carte prête
    viewer.ready().then(function () {
      log('MAP_READY');
      sendToRN('MAP_READY', {});
    });

    // L'utilisateur clique sur un POI
    viewer.on('poiSelected', function (poi) {
      log('POI_SELECTED ' + poi.id);
      sendToRN('POI_SELECTED', {
        poi: {
          id:       poi.id,
          name:     poi.name      || poi.id,
          floor:    poi.floor     || poi.floorId || '',
          category: poi.category  || null,
          lat:      poi.lat       || null,
          lng:      poi.lng       || null,
        },
      });
    });

    // Changement d'étage (si VisioOne l'émet nativement)
    viewer.on('floorChanged', function (data) {
      log('FLOOR_CHANGED ' + data.floorId);
      sendToRN('FLOOR_CHANGED', { floorId: data.floorId || data.id || '' });
    });


    // ── Commandes React Native → VisioOne ─────────────────────────────────
    //
    // Le BRIDGE_BOOTSTRAP_SCRIPT injecté par react-native-webview convertit
    // chaque MessageEvent 'message' en CustomEvent 'rnCommand'. Ce listener
    // gère donc toutes les commandes envoyées depuis l'app React Native.
    //
    window.addEventListener('rnCommand', function (event) {
      var cmd = event.detail; // { type, payload }
      log('← RN : ' + JSON.stringify(cmd));

      switch (cmd.type) {

        // ── Exemple 1 — Recherche POI ──────────────────────────────
        case 'SEARCH_POI':
          viewer.search({ query: cmd.payload.query })
            .then(function (results) {
              sendToRN('SEARCH_RESULTS', {
                query: cmd.payload.query,
                pois: (results || []).map(function (r) {
                  return {
                    id:       r.id,
                    name:     r.name     || r.id,
                    floor:    r.floor    || r.floorId || '',
                    category: r.category || null,
                  };
                }),
              });
            })
            .catch(function (err) {
              log('SEARCH_POI error: ' + err);
              sendToRN('SEARCH_RESULTS', { query: cmd.payload.query, pois: [] });
            });
          break;

        // ── Exemple 2 — Navigation vers un POI ────────────────────
        case 'NAVIGATE_TO':
          viewer.navigateTo({ poiId: cmd.payload.poiId })
            .then(function (route) {
              sendToRN('NAVIGATION_STARTED', {
                route: {
                  steps:    (route && route.steps)    || [],
                  duration: (route && route.duration) || 0,
                  distance: (route && route.distance) || 0,
                },
              });
            })
            .catch(function (err) {
              log('NAVIGATE_TO error: ' + err);
            });
          break;

        // ── Exemple 4 — Calcul d'itinéraire ───────────────────────
        case 'CREATE_ROUTE':
          viewer.computeRoute({ from: cmd.payload.from, to: cmd.payload.to })
            .then(function (route) {
              sendToRN('ROUTE_READY', {
                steps:    (route && route.steps)    || [],
                duration: (route && route.duration) || 0,
                distance: (route && route.distance) || 0,
              });
            })
            .catch(function (err) {
              log('CREATE_ROUTE error: ' + err);
            });
          break;

        // ── Exemple 5 — Changement d'étage ────────────────────────
        case 'SET_FLOOR':
          viewer.setFloor(cmd.payload.floorId);
          sendToRN('FLOOR_CHANGED', { floorId: cmd.payload.floorId });
          break;

        default:
          log('Commande inconnue : ' + cmd.type);
      }
    });

    log('Bridge VisioOne ↔ React Native prêt (RN=' + IS_RN + ')');
  })();
  </script>

</body>
</html>
